<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio - Pedro Max</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="midias/icon.png" type="image/png">
</head>
<body>
<canvas id="bg-canvas"></canvas>

<header class="hero">
  <!-- Loader (fica por cima, some quando carregar) -->
  <div id="page-loader" aria-hidden="true">
    <div class="loader-box">
      <div class="loader-logo">MAX</div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <!-- Hero / Perfil -->
  <div class="hero-inner">
    <div class="foto-wrap">
      <img src="midias/minha-foto.jpg" alt="Pedro Max" class="foto-perfil" />
      <div class="neon-ring"></div>
    </div>

    <div class="hero-text">
      <h1>Pedro Max</h1>

      <!-- typing effect -->
      <div class="role-wrap">
        <span id="typed"></span><span class="typed-cursor">|</span>
      </div>

      <p class="hero-sub">Designer em formação com foco em posts, carrosséis, stories e flyers.</p>

      <!-- redes (opcional) -->
      <div class="social-links">
        <a href="https://wa.me/558185567478" target="_blank" rel="noopener noreferrer">
          <img src="midias/whatsapp-white.svg" alt="WhatsApp">
        </a>
        <a href="https://instagram.com/pedromax14" target="_blank" rel="noopener noreferrer">
          <img src="midias/instagram-white.png" alt="Instagram">
        </a>
        <a href="https://github.com/PedroMaxDEV" target="_blank" rel="noopener noreferrer">
          <img src="midias/github-white.svg" alt="GitHub">
        </a>
      </div>
    </div>
  </div>
</header>


<section id="portfolio" class="portfolio"></section>

<script src="script.js"></script>
</body>
</html>
