<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Administrativo - Jocelia Festas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <header>
    <h1>Painel Administrativo</h1>
  </header>

  <main style="padding:20px;">
    <!-- Login -->
    <section id="loginSection">
      <h2>Entrar</h2>
      <input type="email" id="email" placeholder="Email"><br><br>
      <input type="password" id="password" placeholder="Senha"><br><br>
      <button onclick="login()">Login</button>
    </section>

    <!-- Área restrita -->
    <section id="adminSection" style="display:none;">
      <h2>Adicionar Produto</h2>
      <form id="productForm">
        <input type="text" id="nome" placeholder="Nome do produto" required><br><br>
        <input type="number" id="preco" placeholder="Preço (R$)" required><br><br>
        <textarea id="descricao" placeholder="Descrição" required></textarea><br><br>
        <input type="text" id="categoria" placeholder="Categoria (ou nova)" required><br><br>
        <label>Imagens:</label><br>
        <input type="file" id="imagens" multiple accept="image/*"><br><br>
        <label>Destaque:</label>
        <input type="checkbox" id="destaque"><br><br>
        <input type="text" id="tags" placeholder="Tags separadas por vírgula"><br><br>
        <button type="submit">Salvar Produto</button>
      </form>

      <h2>Produtos Cadastrados</h2>
      <ul id="productListAdmin"></ul>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
